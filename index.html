<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoonPlug AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#0f0f0f"
    >

    <link
        rel="icon"
        href="icon.svg"
        type="image/svg+xml"
    >

</head>


<body>

<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="sidebar">

    <div class="sidebar-logo">
        🌙 <span>MoonPlug</span>
    </div>


    <div class="sidebar-buttons">

        <button class="sidebar-button">
            ➕ <span>New Chat</span>
        </button>

        <button class="sidebar-button">
            🧠 <span>AI Learn</span>
        </button>

        <button class="sidebar-button">
            📚 <span>Study</span>
        </button>

        <button class="sidebar-button">
            🍳 <span>Cook</span>
        </button>

        <button class="sidebar-button">
            🖼️ <span>Image</span>
        </button>

        <button class="sidebar-button">
            💻 <span>Code</span>
        </button>

        <button class="sidebar-button">
            🔄 <span>AI Switch</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-button">
            💬 <span>Chat History</span>
        </button>

    </div>


    <div class="sidebar-bottom">

     <button
    id="settingsButton"
    class="sidebar-button"
>
    ⚙️ <span>Settings</span>
</button>

        <button class="sidebar-button">
            👤 <span>Account</span>
        </button>

    </div>

</nav>


<!-- =====================================================
     CHAT
===================================================== -->

<section
    id="chat"
    class="chat-section"
>

    <div class="chat-container">


        <!-- CHAT HEADER -->

        <div class="chat-header">

            <div>

                <strong>
                    MoonPlug
                </strong>

                <span>
                    AI
                </span>

            </div>

            <div class="online">
                ● Online
            </div>

        </div>


        <!-- MOONPLUG ANIMATION -->

        <div class="moonplug-animation">

            <div class="plug">
                🔌
            </div>

            <div class="cable"></div>

            <div class="moon">
                🌙
            </div>

        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask MoonPlug anything.
                </p>

            </div>

        </div>


        <!-- TYPING INDICATOR -->

        <div
            id="typing"
            class="typing"
            style="display: none;"
        >
            MoonPlug is thinking...
        </div>


        <!-- INPUT -->

        <div class="chat-input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Message MoonPlug..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<div id="settingsPanel" class="settings-panel">

    <div class="settings-box">

        <div class="settings-header">
            <h2>Settings</h2>

            <button
                id="closeSettings"
                class="close-settings"
            >
                ✕
            </button>
        </div>

        <div class="setting-item">
            <strong>Appearance</strong>
            <span>Customize MoonPlug</span>
        </div>

        <div class="setting-item">
            <strong>Theme</strong>
            <span>Dark</span>
        </div>

        <div class="setting-item">
            <strong>About</strong>
            <span>MoonPlug AI</span>
        </div>

    </div>

</div>
<script src="script.js"></script>

</body>

</html>
