<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoonPlug AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#0f0f0f"
    >

    <link
        rel="icon"
        href="icon.svg"
        type="image/svg+xml"
    >

</head>


<body>

<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav>

    <div class="logo">
        MOONPLUG<span>AI</span>
    </div>

    <div class="nav-links">

        <a href="#chat">
            Chat
        </a>

        <a href="#features">
            Features
        </a>

        <a href="#about">
            About
        </a>

    </div>

</nav>


<!-- =====================================================
     CHAT
===================================================== -->

<section
    id="chat"
    class="chat-section"
>

    <div class="chat-container">


        <!-- CHAT HEADER -->

        <div class="chat-header">

            <div>

                <strong>
                    MoonPlug
                </strong>

                <span>
                    AI
                </span>

            </div>

            <div class="online">
                ● Online
            </div>

        </div>


        <!-- MOONPLUG ANIMATION -->

        <div class="moonplug-animation">

            <div class="plug">
                🔌
            </div>

            <div class="cable"></div>

            <div class="moon">
                🌙
            </div>

        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask MoonPlug anything.
                </p>

            </div>

        </div>


        <!-- TYPING INDICATOR -->

        <div
            id="typing"
            class="typing"
            style="display: none;"
        >
            MoonPlug is thinking...
        </div>


        <!-- INPUT -->

        <div class="chat-input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Message MoonPlug..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>

</html>
