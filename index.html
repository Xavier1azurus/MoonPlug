<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoonPlug AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <nav class="sidebar">

        <!-- LOGO -->

    <div
    class="sidebar-logo"
    id="sidebarToggle"
>
            🌙
            <strong>MOONPLUG</strong>
            <span>AI</span>
        </div>


        <!-- MAIN SIDEBAR BUTTONS -->

        <div class="sidebar-buttons">

            <button
                class="sidebar-button"
                type="button"
            >
                ➕
                <span>New Chat</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                🧠
                <span>AI Learn</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                📚
                <span>Study</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                🍳
                <span>Cook</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                🖼️
                <span>Image</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                💻
                <span>Code</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                🔄
                <span>AI Switch</span>
            </button>


            <div class="sidebar-divider"></div>


            <button
                class="sidebar-button"
                type="button"
            >
                💬
                <span>Chat History</span>
            </button>

        </div>


        <!-- BOTTOM SIDEBAR -->

        <div class="sidebar-bottom">

            <button
                id="settingsButton"
                class="sidebar-button"
                type="button"
            >
                ⚙️
                <span>Settings</span>
            </button>


            <button
                class="sidebar-button"
                type="button"
            >
                👤
                <span>Account</span>
            </button>

        </div>

    </nav>


    <!-- =========================================
         CHAT
    ========================================== -->

    <main
        id="chat"
        class="chat-section"
    >

        <div class="chat-container">


            <!-- CHAT HEADER -->

            <header class="chat-header">

                <div>

                    <strong>
                        MoonPlug
                    </strong>

                    <span>
                        AI
                    </span>

                </div>


                <div class="online">
                    ● Online
                </div>

            </header>


            <!-- MOONPLUG DECORATION -->

            <div
                class="moonplug-animation"
                aria-hidden="true"
            >

                <div class="plug">
                    🔌
                </div>

                <div class="cable"></div>

                <div class="moon">
                    🌙
                </div>

            </div>


            <!-- MESSAGES -->

            <div
                id="messages"
                class="messages"
            >

                <div class="empty-chat">

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        Ask MoonPlug anything.
                    </p>

                </div>

            </div>


            <!-- TYPING INDICATOR -->

            <div
                id="typing"
                class="typing"
                style="display: none;"
            >
                MoonPlug is thinking...
            </div>


            <!-- MESSAGE INPUT -->

            <div class="chat-input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message MoonPlug..."
                    autocomplete="off"
                >


                <button
                    id="sendButton"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>


    <!-- =========================================
         SETTINGS
    ========================================== -->

    <div
        id="settingsPanel"
        class="settings-panel"
    >

        <div class="settings-box">


            <!-- SETTINGS HEADER -->

            <div class="settings-header">

                <h2>
                    Settings
                </h2>


                <button
                    id="closeSettings"
                    class="close-settings"
                    type="button"
                    aria-label="Close settings"
                >
                    ✕
                </button>

            </div>


            <!-- APPEARANCE -->

            <div class="setting-item">

                <strong>
                    Appearance
                </strong>

                <span>
                    Customize MoonPlug
                </span>

            </div>


            <!-- THEME -->

            <div class="setting-item">

                <strong>
                    Theme
                </strong>


                <div class="appearance-options">

                    <button
                        id="themeButton"
                        type="button"
                    >
                        Dark
                    </button>

                </div>

            </div>


            <!-- TEXT SIZE -->

            <div class="setting-item">

                <strong>
                    Text Size
                </strong>


                <div class="appearance-options">

                    <button
                        class="size-button"
                        data-size="small"
                        type="button"
                    >
                        Small
                    </button>


                    <button
                        class="size-button active"
                        data-size="medium"
                        type="button"
                    >
                        Medium
                    </button>


                    <button
                        class="size-button"
                        data-size="large"
                        type="button"
                    >
                        Large
                    </button>

                </div>

            </div>


            <!-- SIDEBAR SIZE -->

            <div class="setting-item">

                <strong>
                    Sidebar Size
                </strong>


                <div class="appearance-options">

                    <button
                        class="sidebar-size-button active"
                        data-sidebar-size="normal"
                        type="button"
                    >
                        Normal
                    </button>


                    <button
                        class="sidebar-size-button"
                        data-sidebar-size="compact"
                        type="button"
                    >
                        Compact
                    </button>


                    <button
                        class="sidebar-size-button"
                        data-sidebar-size="wide"
                        type="button"
                    >
                        Wide
                    </button>

                </div>

            </div>


            <!-- ABOUT -->

            <div class="setting-item">

                <strong>
                    About
                </strong>

                <span>
                    MoonPlug AI
                </span>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
