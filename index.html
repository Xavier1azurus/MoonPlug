<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoonPlug AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =================================================
     SIDEBAR
================================================= -->

<aside class="sidebar">


    <!-- LOGO / SIDEBAR TOGGLE -->

    <div class="sidebar-logo">

        🌙

        <strong>MOONPLUG</strong>

        <span>AI</span>

    </div>


    <!-- SIDEBAR BUTTONS -->

    <div class="sidebar-buttons">


        <button class="sidebar-button">
            ➕
            <span>New Chat</span>
        </button>


        <button class="sidebar-button">
            🧠
            <span>AI Learn</span>
        </button>


        <button class="sidebar-button">
            📚
            <span>Study</span>
        </button>


        <button class="sidebar-button">
            🍳
            <span>Cook</span>
        </button>


        <button class="sidebar-button">
            🖼️
            <span>Images</span>
        </button>


        <button class="sidebar-button">
            💻
            <span>Code</span>
        </button>


        <button class="sidebar-button">
            🔄
            <span>AI Switch</span>
        </button>


        <div class="sidebar-divider"></div>


        <button class="sidebar-button">
            💬
            <span>Chat History</span>
        </button>


    </div>


    <!-- SIDEBAR BOTTOM -->

    <div class="sidebar-bottom">


        <button
            id="settingsButton"
            class="sidebar-button"
            type="button"
        >

            ⚙️

            <span>Settings</span>

        </button>


        <button class="sidebar-button">

            👤

            <span>Account</span>

        </button>


    </div>


</aside>



<!-- =================================================
     CHAT
================================================= -->

<main class="chat-section">


    <div class="chat-container">


        <!-- CHAT HEADER -->

        <header class="chat-header">

            <strong>MoonPlug AI</strong>

            <span class="online">
                ● Online
            </span>

        </header>


        <!-- DECORATION -->

        <div class="moonplug-animation">

            <div class="plug">
                🔌
            </div>

            <div class="cable"></div>

            <div class="moon">
                🌙
            </div>

        </div>


        <!-- =================================================
             MESSAGES
        ================================================= -->

        <div
            id="messages"
            class="messages"
        >


            <!-- EMPTY CHAT -->

            <div class="empty-chat">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask MoonPlug anything.
                </p>

            </div>


        </div>


        <!-- =================================================
             TYPING INDICATOR
        ================================================= -->

        <div
            id="typing"
            class="typing"
            style="display: none;"
        >

            MoonPlug is thinking...

        </div>


        <!-- =================================================
             MESSAGE BAR
        ================================================= -->

        <div class="chat-input-area">


            <input
                id="messageInput"
                type="text"
                placeholder="Ask MoonPlug anything..."
                autocomplete="off"
            >


            <button
                id="sendButton"
                type="button"
                aria-label="Send message"
            >

                ➤

            </button>


        </div>


    </div>


</main>



<!-- =================================================
     SETTINGS
================================================= -->

<div
    id="settingsPanel"
    class="settings-panel"
>


    <div class="settings-box">


        <div class="settings-header">

            <h2>
                Settings
            </h2>


            <button
                id="closeSettings"
                class="close-settings"
                type="button"
            >

                ✕

            </button>

        </div>


        <!-- APPEARANCE -->

        <div class="setting-item">

            <strong>
                Appearance
            </strong>

            <span>
                Choose how MoonPlug looks.
            </span>


            <div class="appearance-options">

                <button
                    id="themeButton"
                    type="button"
                >
                    Dark
                </button>

            </div>

        </div>


        <!-- TEXT SIZE -->

        <div class="setting-item">

            <strong>
                Text Size
            </strong>

            <span>
                Change the chat text size.
            </span>


            <div class="appearance-options">

                <button
                    class="size-button"
                    data-size="small"
                    type="button"
                >
                    Small
                </button>


                <button
                    class="size-button active"
                    data-size="medium"
                    type="button"
                >
                    Medium
                </button>


                <button
                    class="size-button"
                    data-size="large"
                    type="button"
                >
                    Large
                </button>

            </div>

        </div>


    </div>


</div>



<!-- =================================================
     JAVASCRIPT
================================================= -->

<script src="script.js"></script>


</body>

</html>
