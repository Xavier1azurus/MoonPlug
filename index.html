<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoonPlug AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <meta
        name="theme-color"
        content="#0f0f0f"
    >

  

</head>


<body>

<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="sidebar">
<div class="sidebar-logo">
    🌙 <strong>MOONPLUG</strong><span>AI</span>
</div>
   


    <div class="sidebar-buttons">

        <button class="sidebar-button">
            ➕ <span>New Chat</span>
        </button>

        <button class="sidebar-button">
            🧠 <span>AI Learn</span>
        </button>

        <button class="sidebar-button">
            📚 <span>Study</span>
        </button>

        <button class="sidebar-button">
            🍳 <span>Cook</span>
        </button>

        <button class="sidebar-button">
            🖼️ <span>Image</span>
        </button>

        <button class="sidebar-button">
            💻 <span>Code</span>
        </button>

        <button class="sidebar-button">
            🔄 <span>AI Switch</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-button">
            💬 <span>Chat History</span>
        </button>

    </div>


    <div class="sidebar-bottom">

     <button
    id="settingsButton"
    class="sidebar-button"
>
    ⚙️ <span>Settings</span>
</button>

        <button class="sidebar-button">
            👤 <span>Account</span>
        </button>

    </div>

</nav>


<!-- =====================================================
     CHAT
===================================================== -->

<section
    id="chat"
    class="chat-section"
>

  


        <!-- MOONPLUG ANIMATION -->

      


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask MoonPlug anything.
                </p>

            </div>

        </div>


        <!-- TYPING INDICATOR -->

        <div
            id="typing"
            class="typing"
            style="display: none;"
        >
            MoonPlug is thinking...
        </div>


        <!-- INPUT -->

        <div class="chat-input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Message MoonPlug..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<div id="settingsPanel" class="settings-panel">

    <div class="settings-box">

        <div class="settings-header">
            <h2>Settings</h2>

            <button
                id="closeSettings"
                class="close-settings"
            >
                ✕
            </button>
        </div>

        <div class="setting-item">
            <strong>Appearance</strong>
            <span>Customize MoonPlug</span>
        </div>

        <div class="setting-item">
            <strong>Theme</strong>
            <div class="setting-item">
    <strong>Text Size</strong>
<div class="setting-item">
    <strong>Sidebar Size</strong>

    <div class="appearance-options">

        <button
            class="sidebar-size-button active"
            data-sidebar-size="normal"
        >
            Normal
        </button>

        <button
            class="sidebar-size-button"
            data-sidebar-size="compact"
        >
            Compact
        </button>

        <button
            class="sidebar-size-button"
            data-sidebar-size="wide"
        >
            Wide
        </button>

    </div>
</div>
    <div class="appearance-options">

        <button
            class="size-button"
            data-size="small"
        >
            Small
        </button>

        <button
            class="size-button active"
            data-size="medium"
        >
            Medium
        </button>

        <button
            class="size-button"
            data-size="large"
        >
            Large
        </button>

    </div>
</div>
          <button id="themeButton">
    Dark
</button>
        </div>

        <div class="setting-item">
            <strong>About</strong>
            <span>MoonPlug AI</span>
        </div>

    </div>

</div>
<script src="script.js"></script>

</body>

</html>
