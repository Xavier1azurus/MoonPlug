
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#020205">
    <meta name="description" content="MoonPlug AI">

    <title>MoonPlug AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="starField" class="star-field"></div>

<!-- =========================
     SIDEBAR
========================= -->

<aside id="sidebar" class="sidebar">

    <button
        id="sidebarLogo"
        class="sidebar-logo"
        type="button"
        aria-label="Toggle sidebar"
    >
        <span class="logo-moon">🌙</span>
        <strong>MOONPLUG</strong>
        <span class="logo-ai">AI</span>
    </button>

    <div class="sidebar-buttons">

        <button id="newChatButton" class="sidebar-button" type="button">
            <span class="side-icon">+</span>
            <b>New Chat</b>
        </button>

        <button id="conversationButton" class="sidebar-button" type="button">
            <span class="side-icon">◉</span>
            <b>Conversation</b>
        </button>

        <button id="studyButton" class="sidebar-button" type="button">
            <span class="side-icon">▣</span>
            <b>Study</b>
        </button>

        <button id="cookButton" class="sidebar-button" type="button">
            <span class="side-icon">⌁</span>
            <b>Cook</b>
        </button>

        <button id="imagesButton" class="sidebar-button" type="button">
            <span class="side-icon">□</span>
            <b>Images</b>
        </button>

        <button id="codeButton" class="sidebar-button" type="button">
            <span class="side-icon">&lt;/&gt;</span>
            <b>Code</b>
        </button>

        <div class="sidebar-divider"></div>

        <button id="historyButton" class="sidebar-button" type="button">
            <span class="side-icon">≡</span>
            <b>Chat History</b>
        </button>

    </div>

    <div class="sidebar-bottom">

        <button id="settingsButton" class="sidebar-button" type="button">
            <span class="side-icon">⚙</span>
            <b>Settings</b>
        </button>

        <button id="accountButton" class="sidebar-button" type="button">
            <span class="side-icon">○</span>
            <b>Account</b>
        </button>

    </div>

</aside>


<!-- =========================
     MAIN CHAT
========================= -->

<main class="chat-section">

    <div class="chat-container">

        <header class="chat-header">

            <strong>MoonPlug AI</strong>

            <span class="online">
                <i></i>
                Online
            </span>

        </header>


        <div id="messages" class="messages">

            <div id="emptyChat" class="empty-chat">

                <div class="moon-symbol">🌙</div>

                <h1>What can I help with?</h1>

                <p>Ask MoonPlug anything.</p>

            </div>

        </div>


        <div id="typing" class="typing" hidden>

            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>

            <span>MoonPlug is thinking...</span>

        </div>


        <div class="chat-bottom-area">

            <div class="chat-input-area">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask MoonPlug anything..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendButton"
                    type="button"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </div>

            <p class="input-hint">
                MoonPlug can make mistakes. Check important information.
            </p>

        </div>

    </div>

</main>


<!-- =========================
     CONVERSATION MODE
========================= -->

<section
    id="conversationMode"
    class="conversation-mode"
    aria-hidden="true"
>

    <div class="conversation-top">

        <button
            id="conversationClose"
            class="conversation-close"
            type="button"
            aria-label="Close conversation"
        >
            ×
        </button>


        <div class="conversation-brand">
            <span>🌙</span>
            <strong>MoonPlug</strong>
        </div>


        <div class="conversation-live">
            <i></i>
            LIVE
        </div>

    </div>


    <!-- =========================
         BLACK HOLE
    ========================= -->

    <div class="black-hole-stage">

        <div class="black-hole">

            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>
            <div class="orbit orbit-four"></div>

            <div class="black-hole-glow"></div>

            <div class="black-hole-outline"></div>

            <div class="black-hole-core"></div>

            <div
                id="voiceWave"
                class="voice-wave"
                aria-hidden="true"
            >
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


    <div
        id="conversationStatus"
        class="conversation-status"
    >
        Ready
    </div>


    <div
        id="conversationText"
        class="conversation-text"
    >
        Tap the button to talk
    </div>


    <!-- =========================
         ONE BUTTON
    ========================= -->

    <div class="conversation-button-area">

        <button
            id="conversationMic"
            class="conversation-main-button"
            type="button"
            aria-label="Start talking"
        >

            <span class="mic-icon">

                <span class="mic-head"></span>

                <span class="mic-body"></span>

                <span class="mic-stand"></span>

                <span class="mic-base"></span>

            </span>

        </button>

    </div>


    <p class="conversation-hint">
        Tap to talk
    </p>

</section>


<!-- =========================
     SETTINGS
========================= -->

<section
    id="settingsPanel"
    class="modal"
    aria-hidden="true"
>

    <div class="settings-box">

        <div class="modal-header">

            <h2>Settings</h2>

            <button
                id="closeSettings"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="setting-item">

            <strong>Text Size</strong>

            <p>
                Change the size of chat messages.
            </p>

            <div class="setting-buttons">

                <button
                    class="size-button"
                    data-size="small"
                >
                    Small
                </button>

                <button
                    class="size-button active"
                    data-size="medium"
                >
                    Medium
                </button>

                <button
                    class="size-button"
                    data-size="large"
                >
                    Large
                </button>

            </div>

        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
